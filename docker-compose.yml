services:
  postgres:
    image: postgres:16-alpine
    container_name: cartflow-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cartflow}
      POSTGRES_USER: ${POSTGRES_USER:-cartflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cartflow_pass}
    ports:
      - "5433:5432"
    volumes:
      - cartflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartflow_user -d cartflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cartflow-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - cartflow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: cartflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list 2>&1 | grep -v ERROR || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

volumes:
  cartflow_pg_data:
  cartflow_redis_data:
